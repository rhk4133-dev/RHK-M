<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaClone Feed</title>
    <style>
        body { margin: 0; background: black; color: white; font-family: sans-serif; }
        .reels-container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .reel { height: 100vh; width: 100%; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid #333; }
        video { height: 100%; width: 100%; object-fit: cover; }
        .overlay { position: absolute; bottom: 40px; left: 15px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
    </style>
</head>
<body>
    <div class="reels-container">
        <div class="reel">
            <video src="https://www.w3schools.com/html/mov_bbb.mp4" loop autoplay muted></video>
            <div class="overlay"><h3>@Coder_Raghav</h3><p>Success! Login is working. 🚀</p></div>
        </div>
        <div class="reel">
            <video src="https://www.w3schools.com/html/movie.mp4" loop autoplay muted></video>
            <div class="overlay"><h3>@InstaClone</h3><p>Swipe up for more reels!</p></div>
        </div>
    </div>
</body>
</html>
