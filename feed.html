<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InstaClone - Reels</title>
    <style>
        body { margin: 0; background: black; color: white; font-family: sans-serif; }
        .reels-container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }
        .reel { height: 100vh; width: 100%; scroll-snap-align: start; position: relative; display: flex; align-items: center; justify-content: center; }
        video { height: 100%; width: 100%; object-fit: cover; }
        .info { position: absolute; bottom: 30px; left: 20px; text-shadow: 1px 1px 5px rgba(0,0,0,1); }
    </style>
</head>
<body>
    <div class="reels-container">
        <div class="reel">
            <video src="https://www.w3schools.com/html/mov_bbb.mp4" loop autoplay muted></video>
            <div class="info"><h3>@Creator1</h3><p>My first Reel on GitHub!</p></div>
        </div>
        <div class="reel">
            <video src="https://www.w3schools.com/html/movie.mp4" loop autoplay muted></video>
            <div class="info"><h3>@Coder_Raghav</h3><p>Login working via Firebase 🚀</p></div>
        </div>
    </div>
</body>
</html>
