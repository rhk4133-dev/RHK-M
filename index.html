<!DOCTYPE html>
<html>
<head>
    <title>RHK Music Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Floating Icons -->
<div class="music-bg">
    <span>🎵</span>
    <span>🎶</span>
    <span>🎧</span>
    <span>🎼</span>
</div>

<!-- HOME -->
<div id="homePage" class="home">
    <div class="hero-card">
        <h1 class="logo">RHK MUSIC</h1>
        <p>Feel The Premium Sound Experience</p>
        <button onclick="enterApp()" class="enter-btn">ENTER MUSIC</button>
    </div>
</div>

<!-- APP -->
<div id="musicApp" class="app">
    <h2 class="app-title">🔥 RHK MUSIC PREMIUM 🔥</h2>

    <input type="text" id="searchBar" placeholder="Search song..." onkeyup="searchSong()">
    <div class="song-grid" id="songGrid"></div>

    <!-- PLAYER -->
    <div id="playerView" class="player-view">
        <div class="overlay"></div>

        <div class="center-player">
            <div class="cd-container">
                <div class="energy-ring" id="energyRing"></div>
                <div class="cd" id="cd"></div>
            </div>

            <h2 id="nowTitle"></h2>

            <div class="player-controls">
                <button onclick="prevSong()">⏮</button>
                <button onclick="minus10()">⏪</button>
                <button onclick="togglePlay()" id="playBtn">⏸</button>
                <button onclick="plus10()">⏩</button>
                <button onclick="nextSong()">⏭</button>
            </div>

            <button onclick="goBack()" class="back-btn">⬅ Back</button>
        </div>
    </div>

    <div id="youtubePlayer"></div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="script.js"></script>

</body>
</html>
