<!DOCTYPE html>
<html>
<head>
    <title>RHK Music Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Floating Music Notes -->
<div class="music-bg">
    <span>🎵</span>
    <span>🎶</span>
    <span>🎧</span>
    <span>🎼</span>
    <span>🎵</span>
</div>

<!-- HOME PAGE -->
<div id="homePage" class="home">
    <div class="hero-card">
        <h1 class="logo">RHK MUSIC</h1>
        <p class="tagline">Feel The Premium Sound Experience</p>
        <button onclick="enterApp()" class="enter-btn">ENTER MUSIC</button>
    </div>
</div>

<!-- MUSIC APP -->
<div id="musicApp" class="app" style="display:none;">

    <h2 class="app-title">🔥 RHK MUSIC PREMIUM 🔥</h2>

    <input type="text" id="searchBar" placeholder="Search RHK song..." onkeyup="searchSong()">

    <div class="song-grid" id="songGrid"></div>

    <!-- PLAYER -->
    <div id="playerView" class="player-view" style="display:none;">
        <div class="overlay"></div>

        <div class="center-player">
            <div class="cd" id="cd"></div>
            <h2 id="nowTitle"></h2>

            <p class="gesture-info">Double tap ➡ +10s | ⬅ -10s</p>

            <div class="controls">
                <button onclick="prevSong()" class="control-btn">⏮</button>
                <button onclick="togglePlay()" id="playBtn" class="control-btn">⏸</button>
                <button onclick="nextSong()" class="control-btn">⏭</button>
            </div>

            <p class="brand-watermark">RHK MUSIC</p>
        </div>
    </div>

    <audio id="audio"></audio>

</div>

<script src="script.js"></script>
</body>
</html>
