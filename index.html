<!DOCTYPE html>
<html>
<head>
    <title>RHK Music Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HOME PAGE -->
<div id="homePage" class="home">
    <div class="hero-card">
        <h1>🎵 RHK MUSIC</h1>
        <p>Feel The Premium Neon Sound</p>
        <button onclick="enterApp()">ENTER MUSIC</button>
    </div>
</div>

<!-- MUSIC APP -->
<div id="musicApp" class="app" style="display:none;">

    <!-- SEARCH BAR -->
    <input 
        type="text" 
        id="searchBar" 
        placeholder="🔍 Search song..." 
        onkeyup="searchSong()"
    >

    <!-- SONG GRID -->
    <div class="song-grid" id="songGrid"></div>

    <!-- FULL PLAYER VIEW -->
    <div id="playerView" class="player-view" style="display:none;">
        
        <div class="overlay"></div>

        <div class="center-player">

            <!-- VISUALIZER -->
            <div class="visualizer">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>

            <h2 id="nowTitle"></h2>

            <button onclick="goBack()" class="back-btn">
                ⬅ Back
            </button>

        </div>
    </div>

    <!-- AUDIO -->
    <audio id="audio"></audio>

</div>

<script src="script.js"></script>
</body>
</html>
