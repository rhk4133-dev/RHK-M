<!DOCTYPE html>
<html>
<head>
    <title>RHK Music Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HOME PAGE -->
<div id="homePage" class="home">
    <div class="hero-card">
        <h1>🎵 RHK MUSIC</h1>
        <p>Select Your Mood</p>

        <div class="category-buttons">
            <button onclick="selectCategory('love')">❤️ Love Songs</button>
            <button onclick="selectCategory('horror')">👻 Horror Songs</button>
            <button onclick="selectCategory('hiphop')">🔥 Hip Hop</button>
        </div>

        <button class="enter-btn" onclick="enterApp()">ENTER MUSIC</button>
    </div>
</div>

<!-- MUSIC APP -->
<div id="musicApp" class="app" style="display:none;">

    <input type="text" id="searchBar" placeholder="Search song..." onkeyup="searchSong()">

    <div class="song-grid" id="songGrid"></div>

    <!-- FULL PLAYER -->
    <div id="playerView" class="player-view" style="display:none;">
        <div class="overlay"></div>

        <div class="center-player">
            <div class="cd" id="cd"></div>
            <h2 id="nowTitle"></h2>

            <div class="controls">
                <button onclick="prevSong()">⏮</button>
                <button onclick="nextSong()">⏭</button>
            </div>

            <button onclick="goBack()" class="back-btn">⬅ Back</button>
        </div>
    </div>

    <audio id="audio"></audio>

</div>

<script src="script.js"></script>
</body>
</html>
