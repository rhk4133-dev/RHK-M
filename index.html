<!DOCTYPE html>
<html>
<head>
    <title>RHK Music Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HERO PAGE -->
<div id="homePage" class="home">
    <div class="hero-card">
        <h1>🎵 RHK MUSIC</h1>
        <p>Feel The Premium Sound Experience</p>
        <button onclick="enterApp()">ENTER MUSIC</button>
    </div>
</div>

<!-- MUSIC APP -->
<div id="musicApp" class="app hidden">

    <div class="top-bar">
        <input type="text" id="searchBar" placeholder="Search song..." onkeyup="searchSong()">
        <button id="themeToggle">🌙</button>
    </div>

    <!-- NOW PLAYING -->
    <div class="now-playing">
        <img id="nowImg" src="">
        <div>
            <h2 id="nowTitle">No song selected</h2>
            <div class="visualizer">
                <span></span><span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <!-- SONG GRID -->
    <div class="song-grid" id="songGrid"></div>

    <audio id="audio"></audio>

</div>

<script src="script.js"></script>
</body>
</html>
