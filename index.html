<!DOCTYPE html>
<html>
<head>
    <title>RHK Music Premium</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- HOME PAGE -->
<div id="homePage" class="home">
    <div class="hero-card">
        <h1>🎵 RHK Music Premium</h1>
        <button onclick="enterApp()">Enter App</button>
    </div>
</div>

<!-- MUSIC APP -->
<div id="musicApp" style="display:none;">

    <input type="text" id="searchBar" placeholder="Search song..." onkeyup="searchSong()">

    <div id="songGrid" class="grid"></div>

</div>

<!-- PLAYER VIEW -->
<div id="playerView" class="player">

    <button class="backBtn" onclick="goBack()">⬅</button>

    <div id="cd" class="cd"></div>

    <h2 id="nowTitle">Song Name</h2>

    <audio id="audio"></audio>

    <div class="controls">
        <button onclick="prevSong()">⏮</button>
        <button id="playBtn" onclick="togglePlay()">▶</button>
        <button onclick="nextSong()">⏭</button>
    </div>

    <div class="skip">
        <button onclick="minus10()">-10s</button>
        <button onclick="plus10()">+10s</button>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
