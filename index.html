<!DOCTYPE html>
<html>
<head>
    <title>RHK AI Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="assistant">
    <div class="eyes">
        <div class="eye"></div>
        <div class="eye"></div>
    </div>
    <h2>RHK AI</h2>
    <button id="talkBtn">🎤 Talk</button>
</div>

<div class="player-section">
    <h3 id="songTitle">No Song Playing</h3>
    <div id="player"></div>

    <div class="controls">
        <button onclick="playVideo()">▶</button>
        <button onclick="pauseVideo()">⏸</button>
        <button onclick="forward10()">⏩ +10s</button>
    </div>
</div>

<script src="https://www.youtube.com/iframe_api"></script>
<script src="script.js"></script>
</body>
</html>
