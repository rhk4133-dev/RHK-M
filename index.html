<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ReelStream Mobile</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <div class="app_videos" id="videoContainer">
        <div class="video_container">
            <video class="video_player" loop playsinline src="https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-lights-12353-large.mp4"></video>
            <i class='bx bx-play play_icon'></i>
            <div class="footer">
                <h3>@neon_vibes</h3>
                <p>Night life in the city #aesthetic</p>
            </div>
        </div>
    </div>

    <div class="bottom_nav">
        <label for="videoInput" class="upload_btn">
            <i class='bx bx-plus-circle'></i>
            <input type="file" id="videoInput" accept="video/*" hidden>
        </label>
    </div>

    <script src="script.js"></script>
</body>
</html>
