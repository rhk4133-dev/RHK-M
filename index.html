<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Stream | Audio Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">NEON<span>STREAM</span></div>
            <nav class="menu">
                <div class="menu-item active">Library</div>
                <div class="menu-item">Trending</div>
                <div class="menu-item">Moods</div>
            </nav>
        </aside>

        <main class="content">
            <header class="top-bar">
                <input type="text" placeholder="Search your vibe..." class="search-input">
            </header>

            <section class="music-section">
                <h1>Digital Archive</h1>
                <div class="grid" id="song-grid">
                    </div>
            </section>
        </main>

        <footer class="player-bar">
            <div class="track-info">
                <img src="https://via.placeholder.com/60" id="current-thumb" class="track-art">
                <div class="text">
                    <h4 id="current-title">Initialize System</h4>
                    <p id="current-artist">Select a track</p>
                </div>
            </div>

            <div class="player-controls">
                <div class="buttons">
                    <button class="ctrl-btn" id="prev-btn">⏮</button>
                    <button class="play-btn" id="master-play">▶</button>
                    <button class="ctrl-btn" id="next-btn">⏭</button>
                </div>
                <div class="progress-container">
                    <div class="progress-bar" id="progress"></div>
                </div>
            </div>

            <div class="volume-ctrl">
                <span>VOL</span>
                <div class="vol-slider"></div>
            </div>
        </footer>
    </div>

    <div id="yt-engine"></div>

    <script src="script.js"></script>
</body>
</html>
